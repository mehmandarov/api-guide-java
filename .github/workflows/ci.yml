name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and run tests
        # -Pquarkus activates the Quarkus runtime profile, which produces
        # target/quarkus-app/ (fast-jar). The Testcontainers-based IT tests
        # (ConfApiContainer) build a Docker image that COPYs that directory,
        # so without this profile the image build fails with
        # "Cannot mkdir: /app is not a directory".
        run: mvn -B -ntp -Pquarkus verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

